services:
  db:
    image: mysql:8.0
    container_name: youl-log-db
    restart: always
    environment:
      MYSQL_DATABASE: youl_log
      MYSQL_ROOT_PASSWORD: youl_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer: # DB를 웹에서 편하게 보기 위한 툴
    image: adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  db_data: